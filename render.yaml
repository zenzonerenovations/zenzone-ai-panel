services:
  - type: web
    name: zenzone-ai-panel
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zenzone-db
          property: connectionString

databases:
  - name: zenzone-db
    databaseName: zenzone_ai
    plan: free
