name: Keep Alive — Ping ZenZone AI Panel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://zenzone-ai-panel.onrender.com/)
          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: got HTTP $STATUS"
          fi

